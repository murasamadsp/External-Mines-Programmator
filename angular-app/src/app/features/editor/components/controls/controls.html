<mat-toolbar class="controls-container">
  <!-- Left Section: Main Actions -->
  <div class="controls-group">
    <button mat-icon-button (click)="pasteFromClipboard()" title="Paste Program from Clipboard">
      <mat-icon>content_paste</mat-icon>
    </button>
    <button mat-icon-button (click)="exportProgram()" title="Export Program">
      <mat-icon>save</mat-icon>
    </button>
    <button mat-icon-button (click)="validateProgram()" title="Validate Program">
      <mat-icon>spellcheck</mat-icon>
    </button>
    <button mat-icon-button color="warn" (click)="clearProgram()" title="Clear Program">
      <mat-icon>delete_sweep</mat-icon>
    </button>
  </div>

  <!-- Center Section: Page Navigation -->
  <div class="controls-group page-navigation">
    <button mat-icon-button (click)="prevPage()" [disabled]="programService.currentPage() === 0">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <div class="page-indicator">
      <span>Page</span>
      <span class="page-number">{{ programService.currentPage() + 1 }}</span>
    </div>
    <button mat-icon-button (click)="nextPage()" [disabled]="programService.currentPage() >= 15">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>

  <!-- Right Section: Tools and Menu -->
  <div class="controls-group">
    <button mat-icon-button (click)="toggleTheme()" title="Toggle Theme">
      <mat-icon>{{ isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
    <button mat-icon-button (click)="copyToClipboard()" title="Copy to Clipboard">
      <mat-icon>content_copy</mat-icon>
    </button>
    <button mat-icon-button [matMenuTriggerFor]="toolsMenu">
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #toolsMenu="matMenu">
      <button mat-menu-item (click)="openDecoder()">
        <mat-icon>code</mat-icon>
        <span>Decoder</span>
      </button>
      <button mat-menu-item (click)="openAnalyzer()">
        <mat-icon>analytics</mat-icon>
        <span>Analyzer</span>
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="openSettings()">
        <mat-icon>settings</mat-icon>
        <span>Settings</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>

<!-- Modals -->
<app-decoder-dialog></app-decoder-dialog>
<app-analyzer-dialog></app-analyzer-dialog>
