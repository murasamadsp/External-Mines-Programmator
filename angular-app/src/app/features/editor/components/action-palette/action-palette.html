<mat-card class="action-palette">
  <mat-card-header>
    <mat-card-title>Дії</mat-card-title>
  </mat-card-header>
  <mat-card-content class="actions-list">
    <mat-accordion multi="true">
      @for (category of categoryKeys; track category) {
        <mat-expansion-panel [expanded]="!isCategoryCollapsed(category)">
          <mat-expansion-panel-header>
            <mat-panel-title>
              {{ category }}
            </mat-panel-title>
          </mat-expansion-panel-header>

          <div class="category-actions">
            @for (actionKey of getCategoryActions(category); track actionKey) {
              <button
                mat-button
                class="action-button"
                [class.selected]="isSelected(actionKey)"
                [title]="getActionData(actionKey).tooltip"
                draggable="true"
                (click)="selectAction(actionKey)"
                (dragstart)="onDragStart($event, actionKey)"
              >
                {{ getActionData(actionKey).label }}
              </button>
            }
          </div>
        </mat-expansion-panel>
      }
    </mat-accordion>
  </mat-card-content>
</mat-card>
