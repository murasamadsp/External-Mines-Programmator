<div class="action-palette">
  <div class="palette-header">Дії</div>

  <div class="actions-list">
    @for (category of categoryKeys; track category) {
      <div class="category-container">
        <div
          class="category-header"
          (click)="toggleCategory(category)"
          (keydown)="onCategoryKeyDown($event, category)"
          tabindex="0"
          role="button"
          [attr.aria-expanded]="!isCategoryCollapsed(category)"
        >
          <span>{{ category }}</span>
          <span
            class="category-toggle"
            [class.collapsed]="isCategoryCollapsed(category)"
          >
            ▼
          </span>
        </div>

        <div
          class="category-actions"
          [class.collapsed]="isCategoryCollapsed(category)"
          [style.max-height]="isCategoryCollapsed(category) ? '0px' : null"
        >
          @for (actionKey of getCategoryActions(category); track actionKey) {
            <button
              type="button"
              class="action-button"
              [class.selected]="isSelected(actionKey)"
              [class.dragging]="isDragging(actionKey)"
              [title]="getActionData(actionKey).tooltip"
              draggable="true"
              (click)="selectAction(actionKey)"
              (dragstart)="onDragStart($event, actionKey)"
            >
              {{ getActionData(actionKey).label }}
            </button>
          }
        </div>
      </div>
    }
  </div>
</div>
