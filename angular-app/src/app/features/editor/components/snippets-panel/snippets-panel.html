<mat-card class="snippets-panel">
  <mat-card-header>
    <mat-card-title>📝 Snippets</mat-card-title>
  </mat-card-header>
  <mat-card-content class="snippets-container">
    @for (snippet of snippets(); track snippet.name) {
      <mat-card
        class="snippet-card"
        (click)="onSnippetClick(snippet)"
        (keydown)="onSnippetKeyDown($event, snippet)"
        tabindex="0"
        role="button"
        [attr.aria-label]="snippet.name"
      >
        <mat-card-header>
          <div mat-card-avatar class="snippet-icon">{{ snippet.icon }}</div>
          <mat-card-title>{{ snippet.name }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p>{{ snippet.description }}</p>
        </mat-card-content>
      </mat-card>
    }
  </mat-card-content>
</mat-card>
