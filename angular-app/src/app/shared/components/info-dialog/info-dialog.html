<div
  class="dialog-overlay"
  [class.visible]="visible()"
  (click)="onOverlayClick($event)"
  (keydown)="onKeyDown($event)"
  tabindex="0"
  role="dialog"
  [attr.aria-modal]="true"
  [attr.aria-labelledby]="'info-dialog-title'"
>
  <div class="dialog-content" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()" tabindex="-1">
    <h3 id="info-dialog-title">{{ title }}</h3>
    <div class="dialog-body">
      <p>{{ message() }}</p>
    </div>
    <div class="dialog-buttons">
      <button type="button" class="btn-primary" (click)="onOk()">OK</button>
    </div>
  </div>
</div>
